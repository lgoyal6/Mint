[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint"
version = "0.1.0"
description = "Lead enrichment service for Apollo and Exa research."
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "openpyxl",
    "pypdf",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "pyyaml",
    "sqlalchemy>=2",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
